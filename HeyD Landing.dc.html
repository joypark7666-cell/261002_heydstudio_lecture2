  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--surface-page); }
    a { color: var(--brand-main); text-decoration: none; }
    a:hover { color: var(--blue-700); }
    nav a { color: var(--text-body); }
    nav a:hover { color: var(--brand-main); }

    /* ===== 모바일 반응형 (<=768px) ===== */
    @media (max-width: 768px) {
      .heyd-pad { padding: 64px 20px !important; }
      .heyd-2col, .heyd-portfolio-grid, .heyd-designer-grid { grid-template-columns: 1fr !important; }
      .heyd-designer-grid { padding: 56px 20px 0 !important; gap: 8px !important; }
      .heyd-designer-text { padding-bottom: 32px !important; }
      .heyd-h2 { font-size: 26px !important; }
      .heyd-hero-tile { display: none !important; }
      .heyd-hero-inner { padding: 64px 20px 72px !important; }
      .heyd-hero-h1 { font-size: 32px !important; }
      .heyd-hero-btns, .heyd-contact-btns { flex-direction: column !important; width: 100% !important; }
      .heyd-hero-btns > *, .heyd-contact-btns > * { width: 100% !important; }
      .heyd-hero-stats { flex-wrap: wrap !important; justify-content: center !important; gap: 6px 16px !important; }
      .heyd-designer-photo { height: auto !important; }
      .heyd-designer-glow { display: none !important; }
      .heyd-designer-img { position: static !important; height: auto !important; max-width: 68% !important; transform: none !important; margin: 8px auto 0 !important; display: block !important; }
      .heyd-designer-card { position: static !important; right: auto !important; top: auto !important; max-width: 300px; margin: 16px auto 0 !important; }
      .heyd-steps { flex-direction: column !important; gap: 12px !important; }
      .heyd-step-connector { display: none !important; }
      .heyd-contact-box { padding: 40px 22px !important; }
    }
  </style>
