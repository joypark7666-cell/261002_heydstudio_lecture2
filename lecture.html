<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>헤이디 | 강의 문의</title>
<!-- 강의 문의 페이지 비활성화 중: 검색에 노출되지 않게 하고, 들어오면 메인으로 보낸다.
     다시 열 때: 아래 meta·script 두 줄을 지우고, ui/Nav2.jsx 의 SHOW_LECTURE 를 true 로 바꾼다. -->
<meta name="robots" content="noindex">
<script>location.replace("/");</script>
<script src="./support.js"></script>
<script type="module" src="./firebase-init.js"></script>
</head>
<body>
<!-- Netlify Forms 감지용 숨김 폼 (배포 시 Netlify 봇이 이 폼을 읽어 등록). 실제 제출은 LectureForm의 fetch가 담당.
     필드는 LectureForm이 보내는 필드와 정확히 일치해야 한다. -->
<form name="lecture-inquiry" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
  <input type="hidden" name="form-name" value="lecture-inquiry" />
  <input type="text" name="bot-field" />
  <input type="text" name="subject" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <textarea name="message"></textarea>
  <input type="file" name="attachment" />
</form>

  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--surface-page); }
    a { color: var(--brand-main); text-decoration: none; }
    a:hover { color: var(--blue-700); }
    nav a { color: var(--text-body); }
    nav a:hover { color: var(--brand-main); }

    /* ===== 모바일 반응형 (<=768px) — index.html 과 같은 규칙 + 강의 페이지용(.heyd-3col) ===== */
    @media (max-width: 768px) {
      .heyd-pad { padding: 64px 20px !important; }
      .heyd-2col, .heyd-3col { grid-template-columns: 1fr !important; }
      .heyd-h2 { font-size: 26px !important; }
      .heyd-nav-inner { padding: 0 20px !important; }
      .heyd-nav-links { gap: 2px !important; }
      .heyd-nav-links a { padding: 8px 12px !important; font-size: 14px !important; }
      /* 히어로 */
      .heyd-hero-tile { display: none !important; }
      .heyd-hero-inner { padding: 64px 20px 72px !important; }
      .heyd-hero-h1 { font-size: 32px !important; }
      .heyd-hero-btns { flex-direction: column !important; width: 100% !important; }
      .heyd-hero-btns > * { width: 100% !important; }
      /* 진행 방식: 세로 스택 */
      .heyd-steps { flex-direction: column !important; gap: 12px !important; }
      .heyd-step-connector { display: none !important; }
    }
  </style>
